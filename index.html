<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamerCollab | Global Lobby</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    /* ALL YOUR PREVIOUS CSS GOES HERE */
    :root { --bg: #0f111a; --card: #1a1d2e; --accent: #ff4655; --green: #00e676; --text: #ffffff; --subtext: #8b92b0; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--card); padding: 15px 30px; border-bottom: 2px solid var(--accent); }
    h1 { margin: 0; color: var(--accent); }
    .container { max-width: 1200px; margin: 20px auto; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .panel { background: var(--card); padding: 20px; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #2e344e; background: #0f111a; color: white; }
    button { background: var(--accent); cursor: pointer; font-weight: bold; border: none; }
    button:hover { opacity: 0.9; }
    .room-card { background: #151824; border: 1px solid #2e344e; padding: 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .room-card h4 { margin: 0 0 5px 0; color: var(--green); }
    #call-stage { max-width: 1200px; margin: 20px auto; padding: 20px; background: #151824; border: 2px solid var(--accent); border-radius: 10px; display: none; }
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
    video { width: 100%; height: 200px; background: black; border-radius: 6px; object-fit: cover; }
  </style>
</head>
<body>

  <header>
    <h1>GamerCollab</h1>
    <span>Global Creator Lobby</span>
  </header>

  <div class="container">
    <!-- Left: Profile -->
    <div class="panel">
      <h3>1. Your Profile</h3>
      <input type="text" id="username" placeholder="Your Channel Name">
      
      <h3>2. Host a Room</h3>
      <input type="text" id="room-title" placeholder="e.g. Minecraft Survival Duo">
      <button id="btn-host">Host Public Room</button>
    </div>

    <!-- Right: Global Browser -->
    <div class="panel">
      <h3>Live Global Lobby</h3>
      <div id="lobby-list">
        <p style="color:var(--subtext);">Loading global rooms...</p>
      </div>
    </div>
  </div>

  <!-- Call Stage -->
  <div id="call-stage">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; color:var(--accent);">Live Call</h3>
      <button id="btn-leave" style="width:auto; padding:5px 15px;">Leave Call</button>
    </div>
    <div class="video-grid">
      <div>
        <p>You</p>
        <video id="local-video" autoplay muted></video>
      </div>
      <div>
        <p>Partner</p>
        <video id="remote-video" autoplay></video>
      </div>
    </div>
  </div>

  <!-- FIREBASE MODULES -->
  <script type="module">
    // Import Firebase tools
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ==========================================
    // STEP 3: PASTE YOUR FIREBASE CONFIG HERE!
    // ==========================================
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "PASTE_YOUR_DOMAIN_HERE",
      databaseURL: "PASTE_YOUR_DATABASE_URL_HERE",
      projectId: "PASTE_YOUR_PROJECT_ID_HERE",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };
    // ==========================================

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Setup Video Peer
    const myPeerId = 'gcollab-' + Math.random().toString(36).substr(2, 9);
    const peer = new Peer(myPeerId);
    
    let localStream = null;
    let currentCall = null;
    let myRoomRef = null;

    // Listen for global list updates
    const lobbyRef = ref(db, 'active_rooms');
    onValue(lobbyRef, (snapshot) => {
      const rooms = snapshot.val();
      const lobbyDiv = document.getElementById('lobby-list');
      lobbyDiv.innerHTML = '';

      if (!rooms) {
        lobbyDiv.innerHTML = '<p style="color:var(--subtext);">No rooms right now. Be the first to host!</p>';
        return;
      }

      Object.keys(rooms).forEach(key => {
        const room = rooms[key];
        // Don't show our own room in the join list
        if (room.peerId === myPeerId) return; 

        const card = document.createElement('div');
        card.className = 'room-card';
        card.innerHTML = `
          <div>
            <h4>${room.title}</h4>
            <span style="font-size:0.8rem; color:var(--subtext);">Host: ${room.host}</span>
          </div>
          <button style="width:auto; padding:8px 15px; background:var(--green); color:black;" data-target="${room.peerId}">Join</button>
        `;
        
        // Add click event to the join button
        card.querySelector('button').addEventListener('click', () => joinRoom(room.peerId));
        lobbyDiv.appendChild(card);
      });
    });

    // Handle Hosting
    document.getElementById('btn-host').addEventListener('click', async () => {
      const title = document.getElementById('room-title').value || "Chilling & Gaming";
      const host = document.getElementById('username').value || "Anonymous";

      await startMedia();
      
      // Push room to the global database
      myRoomRef = ref(db, 'active_rooms/' + myPeerId);
      set(myRoomRef, {
        title: title,
        host: host,
        peerId: myPeerId
      });

      showStage();
    });

    // Handle Joining
    async function joinRoom(targetPeerId) {
      await startMedia();
      currentCall = peer.call(targetPeerId, localStream);
      
      currentCall.on('stream', remoteStream => {
        document.getElementById('remote-video').srcObject = remoteStream;
      });
      showStage();
    }

    // Answer incoming calls
    peer.on('call', async (call) => {
      currentCall = call;
      await startMedia();
      call.answer(localStream);
      call.on('stream', remoteStream => {
        document.getElementById('remote-video').srcObject = remoteStream;
      });
      
      // Remove room from public list so a 3rd person doesn't join
      if (myRoomRef) {
        remove(myRoomRef);
      }
    });

    async function startMedia() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        document.getElementById('local-video').srcObject = localStream;
      }
    }

    function showStage() {
      document.getElementById('call-stage').style.display = 'block';
      document.getElementById('call-stage').scrollIntoView({ behavior: 'smooth' });
    }

    // Leave and Cleanup
    document.getElementById('btn-leave').addEventListener('click', () => {
      if (currentCall) currentCall.close();
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (myRoomRef) remove(myRoomRef); // Delete room from global list
      
      document.getElementById('call-stage').style.display = 'none';
    });

    // If they close the tab, delete their room from the database
    window.addEventListener('beforeunload', () => {
      if (myRoomRef) remove(myRoomRef);
    });

  </script>
</body>
</html>
